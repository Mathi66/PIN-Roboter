# Baut das Image bei einem Versions-Tag und veröffentlicht es nach GHCR.
#
# Vorgaben DevOps (12.08.2026):
#   • Plattform linux/amd64
#   • Git-Tag v0.2.0 → Image-Tag 0.2.0 (OHNE führendes v)
#   • kein :latest
#   • Tags sind unveränderlich — ein bereits veröffentlichter Tag wird nicht
#     überschrieben, ein Fehler bekommt eine neue Nummer
#   • Smoke-Test VOR dem Veröffentlichen: Ein Image, das nicht startet, darf
#     gar nicht erst in der Registry landen
name: Veröffentlichen

# Getrennte Tags je Baustein (ADR-0013): „zentrale-0.4.0" und „agent-0.4.0".
# Am Agenten wird häufiger nachgearbeitet — eine gemeinsame Nummer zwänge dazu,
# die Zentrale mitzuziehen, obwohl sich dort nichts geändert hat.
#
# Ein Tag veröffentlicht NUR seinen Baustein. Wer beide will, setzt zwei Tags.
on:
  push:
    tags: ["zentrale-*.*.*", "agent-*.*.*", "simulator-*.*.*"]
  workflow_dispatch:
    inputs:
      baustein:
        description: "Welcher Baustein"
        required: true
        type: choice
        options: [zentrale, agent, simulator, alle]
      version:
        description: "Version ohne Präfix, z. B. 0.4.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mathi66/pin-roboter

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Die Version kommt aus dem Tag, ohne das führende v. Ein abweichender
      # Image-Tag hat bei DevOps schon mehrfach zu Suchaufwand geführt.
      - name: Version und Baustein bestimmen
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            BAUSTEIN="${{ inputs.baustein }}"
          else
            # Aus „zentrale-0.4.0“ wird Baustein=zentrale, Version=0.4.0
            BAUSTEIN="${GITHUB_REF_NAME%%-*}"
            VERSION="${GITHUB_REF_NAME#*-}"
          fi
          case "$BAUSTEIN" in
            zentrale|agent|simulator|alle) ;;
            *) echo "::error::Unbekannter Baustein $BAUSTEIN. Erwartet: zentrale-X.Y.Z, agent-X.Y.Z oder simulator-X.Y.Z."; exit 1 ;;
          esac
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "baustein=$BAUSTEIN" >> "$GITHUB_OUTPUT"
          # Je Baustein ein eigenes Ja/Nein. Bewusst ohne die Kurzform
          # `[ … ] && echo … || true`: Sie ist in einem `set -e`-Kontext eine
          # Falle, weil der letzte Rueckgabewert den Schritt bestimmt.
          for B in zentrale agent simulator; do
            if [ "$BAUSTEIN" = "alle" ] || [ "$BAUSTEIN" = "$B" ]; then
              echo "$B=ja" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "Baustein: $BAUSTEIN, Version: $VERSION"

      # Die Version im Manifest MUSS zum Image-Tag passen: Das Deploy-Skript
      # vergleicht sie mit dem, was /health meldet. Weichen sie ab, hält es den
      # Deploy für fehlgeschlagen — zu Recht.
      - name: Version im pom prüfen
        run: |
          # Je Baustein sein eigenes pom (ADR-0013). Die Bauklammer oben trägt
          # keine Produktversion mehr.
          for B in zentrale agent simulator; do
            case "${{ steps.version.outputs.baustein }}" in
              "$B"|alle) ;;
              *) continue ;;
            esac
            POM=$(sed -n '/<artifactId>'"$B"'<\/artifactId>/,/<\/version>/p' "src/$B/pom.xml" \
                  | grep -m1 '<version>' | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
            if [ "$POM" != "${{ steps.version.outputs.version }}" ]; then
              echo "::error::src/$B/pom.xml steht auf $POM, der Tag verlangt ${{ steps.version.outputs.version }}."
              echo "Die Version im Manifest muss zum Image-Tag passen — /health meldet sie."
              exit 1
            fi
            echo "$B: $POM ✓"
          done

      # Unveränderliche Tags: Was einmal veröffentlicht wurde, bleibt.
      - name: Tag darf nicht schon existieren
        run: |
          # Je Baustein sein eigenes Abbild. Bis zum 16.08.2026 wurde hier
          # immer nur das Abbild der Zentrale geprueft — ein reiner Agent-Tag
          # waere an einem fremden Abbild gescheitert, und ein bereits
          # vorhandenes Agent-Abbild waere unbemerkt ueberschrieben worden.
          pruefe() {
            [ "$2" = "ja" ] || return 0
            if docker manifest inspect "$1:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "::error::$1:${{ steps.version.outputs.version }} gibt es bereits."
              echo "Tags sind unveraenderlich. Bitte eine neue Versionsnummer vergeben."
              exit 1
            fi
          }
          pruefe "$IMAGE"           "${{ steps.version.outputs.zentrale }}"
          pruefe "$IMAGE-agent"     "${{ steps.version.outputs.agent }}"
          pruefe "$IMAGE-simulator" "${{ steps.version.outputs.simulator }}"
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-anon

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst lokal bauen, testen, dann veröffentlichen. Ein Image, das nicht
      # startet, darf die Registry nie erreichen.
      # Nur wenn die Zentrale veroeffentlicht wird: Ein reiner Agent- oder
      # Simulator-Tag hat sie bisher trotzdem gebaut — mehrere Minuten fuer
      # ein Abbild, das niemand verwendet.
      - name: Image bauen (noch nicht veröffentlichen)
        if: steps.version.outputs.zentrale == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: BAUSTEIN=zentrale
          platforms: linux/amd64
          load: true
          tags: pin-roboter-pruef:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test — startet das Image und antwortet /health?
        if: steps.version.outputs.zentrale == 'ja'
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke --network-alias datenbank \
            -e POSTGRES_DB=pinroboter -e POSTGRES_USER=pinroboter \
            -e POSTGRES_PASSWORD=smoketest postgres:16-alpine
          for i in $(seq 30); do
            docker exec smoke-db pg_isready -U pinroboter && break
            sleep 2
          done

          docker run -d --name smoke-app --network smoke \
            -e DB_URL=jdbc:postgresql://datenbank:5432/pinroboter \
            -e DB_USER=pinroboter -e DB_PASSWORD=smoketest \
            -e GEHEIMNIS_SCHLUESSEL="$(openssl rand -base64 32 | tr -d '\n')" \
            -e SICHERUNG_PLAN=aus \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges:true --cap-drop ALL --pids-limit 512 \
            -p 8090:8090 \
            pin-roboter-pruef:${{ steps.version.outputs.version }}

          # Auf den Healthcheck DES IMAGES warten — genau das tut das
          # Deploy-Skript später auch.
          for i in $(seq 40); do
            ZUSTAND=$(docker inspect -f '{{.State.Health.Status}}' smoke-app 2>/dev/null || echo start)
            [ "$ZUSTAND" = "healthy" ] && break
            [ "$ZUSTAND" = "unhealthy" ] && { docker logs smoke-app; exit 1; }
            sleep 3
          done
          [ "$ZUSTAND" = "healthy" ] || { echo "::error::Container wurde nicht healthy"; docker logs smoke-app; exit 1; }

          ANTWORT=$(curl -sf http://localhost:8090/health)
          echo "Health: $ANTWORT"
          echo "$ANTWORT" | grep -q '"status":"ok"' \
            || { echo "::error::/health meldet nicht ok"; exit 1; }
          echo "$ANTWORT" | grep -q "\"version\":\"${{ steps.version.outputs.version }}\"" \
            || { echo "::error::/health meldet eine andere Version als der Tag"; exit 1; }

          # Der Container läuft als Nicht-Root — DevOps braucht die UID.
          UID_IST=$(docker exec smoke-app id -u)
          [ "$UID_IST" = "10001" ] || { echo "::error::läuft als UID $UID_IST, erwartet 10001"; exit 1; }

          # Sauberes Beenden binnen 10 s (SIGTERM).
          START=$(date +%s)
          docker stop -t 15 smoke-app >/dev/null
          DAUER=$(( $(date +%s) - START ))
          echo "Beenden dauerte ${DAUER}s"
          [ "$DAUER" -le 10 ] || { echo "::error::Beenden dauerte ${DAUER}s, erlaubt sind 10"; exit 1; }

      - name: Zentrale veröffentlichen
        if: steps.version.outputs.zentrale == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: BAUSTEIN=zentrale
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Der Standort-Agent läuft NICHT auf Labs, sondern im Praxisnetz — er
      # braucht trotzdem ein Image.
      #
      # EIGENE Version (ADR-0013): Am Agenten wird häufiger nachgearbeitet, weil
      # die Erfahrung mit Kartenterminals und Konnektoren erst wächst. Eine
      # gemeinsame Nummer zwänge dazu, die Zentrale mitzuziehen, obwohl sich
      # dort nichts geändert hat. Zusammengehalten werden beide nicht durch die
      # Nummer, sondern durch die Protokollversion.
      - name: Standort-Agent veröffentlichen
        if: steps.version.outputs.agent == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: BAUSTEIN=agent
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-agent:${{ steps.version.outputs.version }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # LABORWERKZEUG, kein Produktbestandteil. Der Simulator bildet Konnektor
      # und Kartenterminals nach; auf dem Laborserver hat die Zentrale sonst
      # nichts zu ueberwachen. In einer Praxis oder Klinik hat er nichts zu
      # suchen — die Compose-Datei fuer das Labor haelt ihn deshalb im
      # internen Netz, ohne einen einzigen Port nach aussen.
      - name: Simulator bauen und pruefen
        if: steps.version.outputs.simulator == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: BAUSTEIN=simulator
          platforms: linux/amd64
          load: true
          tags: pin-roboter-sim-pruef:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test Simulator — startet er und gibt er den Vertrauensanker heraus?
        if: steps.version.outputs.simulator == 'ja'
        run: |
          set -euo pipefail
          docker run -d --name smoke-sim -p 8480:8480 \
            --security-opt no-new-privileges:true --cap-drop ALL --pids-limit 512 \
            pin-roboter-sim-pruef:${{ steps.version.outputs.version }}

          for i in $(seq 40); do
            ZUSTAND=$(docker inspect -f '{{.State.Health.Status}}' smoke-sim 2>/dev/null || echo start)
            [ "$ZUSTAND" = "healthy" ] && break
            [ "$ZUSTAND" = "unhealthy" ] && { docker logs smoke-sim; exit 1; }
            sleep 3
          done
          [ "$ZUSTAND" = "healthy" ] || { echo "::error::Simulator wurde nicht healthy"; docker logs smoke-sim; exit 1; }

          # Der Vertrauensanker ist das, was Agent und Zentrale von ihm holen.
          # Kommt er nicht heraus, ist das Abbild fuer das Labor wertlos.
          curl -sf http://localhost:8480/ca.pem | grep -q "BEGIN CERTIFICATE" \
            || { echo "::error::/ca.pem liefert kein Zertifikat"; exit 1; }

          UID_IST=$(docker exec smoke-sim id -u)
          [ "$UID_IST" = "10001" ] || { echo "::error::laeuft als UID $UID_IST, erwartet 10001"; exit 1; }
          docker stop -t 15 smoke-sim >/dev/null

      - name: Simulator veröffentlichen
        if: steps.version.outputs.simulator == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: BAUSTEIN=simulator
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-simulator:${{ steps.version.outputs.version }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Zusammenfassung
        run: |
          {
            echo "### ${{ steps.version.outputs.baustein }} ${{ steps.version.outputs.version }} veröffentlicht"
            echo ""
            echo "\`\`\`"
            V="${{ steps.version.outputs.version }}"
            # Kein `[ … ] && echo …`: Trifft die letzte Bedingung nicht zu,
            # ist der Rueckgabewert des Blocks 1 — und der Schritt scheitert,
            # obwohl alles gut ging. Die Shell laeuft hier mit `bash -e`.
            if [ "${{ steps.version.outputs.zentrale }}"  = "ja" ]; then echo "Zentrale:  $IMAGE:$V"; fi
            if [ "${{ steps.version.outputs.agent }}"     = "ja" ]; then echo "Agent:     $IMAGE-agent:$V"; fi
            if [ "${{ steps.version.outputs.simulator }}" = "ja" ]; then echo "Simulator: $IMAGE-simulator:$V"; fi
            echo "\`\`\`"
            echo ""
            echo "Smoke-Test bestanden: startet gehärtet (read_only, cap_drop ALL),"
            echo "/health meldet ok mit passender Version, UID 10001, SIGTERM ≤ 10 s."
          } >> "$GITHUB_STEP_SUMMARY"

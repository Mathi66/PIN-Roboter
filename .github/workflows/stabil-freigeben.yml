# Erklärt eine bereits veröffentlichte Version zur „stabilen" — und damit zu
# der, die ausgelieferte Standort-Agenten von selbst nachziehen.
#
# WARUM GETRENNT VOM BAUEN (PO/CLAUDE.md, Watchtower-Vorbehalt):
# Würde jeder Tag automatisch „stabil" setzen, ginge jede Version sofort in
# jede Praxis — auch die mit dem Fehler, den man zehn Minuten später bemerkt.
# Ein fehlerhaftes Image legt dort den TI-Zugang lahm.
#
# Deshalb ist die Freigabe eine eigene, bewusste Handlung: Erst wird eine
# Version veröffentlicht und geprüft, dann bekommt sie diesen Tag.
#
# Es wird NICHTS neu gebaut. Der vorhandene Manifest-Eintrag wird zusätzlich
# unter „:stabil" abgelegt — dasselbe Abbild, derselbe Prüfwert.
name: Stabile Version freigeben

on:
  workflow_dispatch:
    inputs:
      zentrale:
        description: "Version der Zentrale, z. B. 0.4.0 — leer lassen, um sie nicht zu ändern"
        required: false
      agent:
        description: "Version des Agenten, z. B. 0.4.1 — leer lassen, um ihn nicht zu ändern"
        required: false
      bestaetigung:
        description: 'Zum Bestätigen "ausrollen" eingeben'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mathi66/pin-roboter

jobs:
  freigeben:
    runs-on: ubuntu-latest
    steps:
      - name: Bestätigung prüfen
        run: |
          if [ "${{ inputs.bestaetigung }}" != "ausrollen" ]; then
            echo "::error::Nicht bestätigt. Diese Version wird damit in JEDER Praxis"
            echo "::error::ausgerollt, in der die selbsttätige Aktualisierung läuft."
            exit 1
          fi

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst prüfen, dass es die Version überhaupt gibt. Ein Tippfehler würde
      # sonst „:stabil" auf ein Abbild setzen, das niemand geprüft hat — oder
      # den Tag ins Leere zeigen lassen.
      - name: Version muss veröffentlicht sein
        run: |
          [ -n "${{ inputs.zentrale }}${{ inputs.agent }}" ] \
            || { echo "::error::Mindestens eine Version angeben."; exit 1; }
          for PAAR in "$IMAGE:${{ inputs.zentrale }}" "$IMAGE-agent:${{ inputs.agent }}"; do
            N="${PAAR%:*}"; V="${PAAR##*:}"
            [ -n "$V" ] || continue
            if ! docker manifest inspect "$N:$V" >/dev/null 2>&1; then
              echo "::error::$N:$V gibt es nicht in GHCR."
              exit 1
            fi
          done

      # Der Agent ist der Baustein, den Praxen selbsttätig nachziehen. Die
      # Zentrale bekommt denselben Tag, damit die Nummern zusammenpassen —
      # ausgerollt wird sie aber vom Deploy-Skript, nicht von Watchtower.
      - name: „stabil" umhängen
        run: |
          for PAAR in "$IMAGE:${{ inputs.zentrale }}" "$IMAGE-agent:${{ inputs.agent }}"; do
            N="${PAAR%:*}"; V="${PAAR##*:}"
            [ -n "$V" ] || { echo "$N bleibt, wie es ist"; continue; }
            docker buildx imagetools create -t "$N:stabil" "$N:$V"
            echo "$N:stabil zeigt jetzt auf $V"
          done

      - name: Zusammenfassung
        run: |
          {
            echo "### Neue stabile Fassungen"
            echo ""
            echo "Standort-Agenten mit selbsttätiger Aktualisierung ziehen sie im"
            echo "nächsten Wartungsfenster nach."
            echo ""
            echo '```'
            [ -n "${{ inputs.zentrale }}" ] && echo "$IMAGE:stabil        → ${{ inputs.zentrale }}"
            [ -n "${{ inputs.agent }}" ]    && echo "$IMAGE-agent:stabil  → ${{ inputs.agent }}"
            true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# PIN-Roboter — Prototyp
#
# Ein Befehl genügt:   docker compose up --build
# Oberfläche danach:   http://localhost:8090
#
# Der Simulator ersetzt Konnektor und Kartenterminals (ADR-0007). Er wird
# NICHT ausgeliefert und ist hier nur enthalten, weil der Prototyp ohne echte
# TI-Hardware lauffähig sein soll.

services:

  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { BAUSTEIN: simulator }
    container_name: pinroboter-simulator
    environment:
      # Bildet die 36 Geräte des Demoszenarios nach: ein MVZ mit neun
      # Betriebsstätten unterschiedlicher Größe, je ein Empfangsterminal mit
      # SMC-B und ein bis fünf Behandlungsräume. Alle erreichbar, neueste
      # Firmware, Managementschnittstelle frei.
      #
      # ERSETZT den Standardaufbau, ergänzt ihn nicht: Dessen vier Geräte
      # tragen die Fehlerfälle, an denen die Systemnachweise messen — und sie
      # landen sonst ohne Bezug in der Einrichtung des Agenten.
      DEMO_TERMINALS: "an"
    ports:
      - "8443:8443"   # Konnektor, SOAP über Brainpool-TLS
      - "8444:8444"   # Kartenterminal-Management über Brainpool-TLS
      - "8445:8445"   # Remote SMCB API (WebSocket) — hier fragt das Terminal die PIN an
      - "8480:8480"   # Steuerung für Tests und Ausgabe des Vertrauensankers
      - "1025:1025"   # Auffang für Benachrichtigungsmails, nur für Nachweise
    healthcheck:
      # wget statt bash: Seit dem Wechsel auf ein Alpine-Laufzeitbild
      # (13.08.2026) gibt es keine bash mehr im Image, und /dev/tcp ist eine
      # bash-Eigenheit. wget gehoert zu BusyBox und ist immer da.
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://localhost:8480/ca.pem || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  datenbank:
    restart: unless-stopped
    image: postgres:17-alpine
    container_name: pinroboter-datenbank
    environment:
      POSTGRES_DB: pinroboter
      POSTGRES_USER: pinroboter
      # Beim Kunden aus einer Konfigurationsdatei, nie im Repository (NFA-BET-010).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nur-fuer-die-entwicklung}
    volumes:
      # NFA-BET-020: persistente Daten liegen in Volumes, nie im Container-Layer.
      - betriebsdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinroboter -d pinroboter"]
      interval: 5s
      timeout: 3s
      retries: 12

  zentrale:
    # Nach der Wiederherstellung beendet sich die Zentrale absichtlich
    # (ADR-0010). Ohne diese Regel bliebe sie danach aus.
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { BAUSTEIN: zentrale }
    container_name: pinroboter-zentrale
    environment:
      PORT: "8090"
      DB_URL: "jdbc:postgresql://datenbank:5432/pinroboter"
      DB_USER: "pinroboter"
      DB_PASSWORD: ${DB_PASSWORD:-nur-fuer-die-entwicklung}
      # Verschluesselt die hinterlegten Geraete-Zugangsdaten (FA-GER-010/020).
      # 32 Byte, Base64. Erzeugen mit:  openssl rand -base64 32
      # Ohne diese Variable bleibt die Bestandserfassung vollstaendig nutzbar,
      # nur Kennwoerter lassen sich nicht speichern - die Oberflaeche sagt das.
      #
      # ACHTUNG beim Betrieb: Geht der Schluessel verloren, sind die
      # gespeicherten Zugangsdaten unbrauchbar und muessen neu hinterlegt
      # werden. Er gehoert in die Sicherung, aber NICHT in dieselbe Datei wie
      # der Datenbankauszug - sonst schuetzt die Verschluesselung vor nichts.
      GEHEIMNIS_SCHLUESSEL: ${GEHEIMNIS_SCHLUESSEL:-}

      # ── Administratorkonto aus der Konfiguration (FA-BEN-035) ────────────
      # Ohne diese Angaben entsteht der erste Administrator einmalig ueber die
      # Ersteinrichtung im Browser - mit einem TOTP-Geheimnis, das nur dabei
      # angezeigt wird. Geht das Datenvolumen verloren, ist der Zugang weg:
      # Bei der naechsten Ersteinrichtung entsteht ein ANDERES Geheimnis, und
      # der Eintrag in der Authenticator-App passt nicht mehr.
      #
      # Sind diese Variablen gesetzt, legt die Zentrale das Konto beim Start
      # an, FALLS ES FEHLT. Ein vorhandenes Konto wird nie veraendert.
      #
      # SICHERHEITSVORBEHALT: Wer diese Datei lesen kann, kennt beide
      # Faktoren - der zweite ist dann keiner mehr. Das ist ein bewusster
      # Tausch zugunsten der Wiederherstellbarkeit. Zwei Gegenmassnahmen:
      #   1. Passwort ueber START_ADMIN_PASSWORT_DATEI aus einem Docker-Secret
      #      lesen statt hier einzutragen (erscheint dann nicht in
      #      "docker inspect" und nicht in der Prozessliste).
      #   2. Nach der Einrichtung die Variablen wieder entfernen.
      # TOTP-Geheimnis erzeugen:  openssl rand -base64 20 | base32 | tr -d '=' | head -c 32
      START_ADMIN_BENUTZER: ${START_ADMIN_BENUTZER:-}
      START_ADMIN_NAME: ${START_ADMIN_NAME:-}
      START_ADMIN_PASSWORT: ${START_ADMIN_PASSWORT:-}
      START_ADMIN_PASSWORT_DATEI: ${START_ADMIN_PASSWORT_DATEI:-}
      START_ADMIN_TOTP: ${START_ADMIN_TOTP:-}

      # Ablage der Sicherungen (FA-BAK-010, ADR-0010). Eigenes Volume, getrennt
      # von den Betriebsdaten: Eine Sicherung im selben Volume wie die Datenbank
      # ist keine — sie verschwindet mit ihr.
      SICHERUNG_ABLAGE: /sicherungen
      # Ausgeschaltet mit "aus". Sonst laufen die drei Pläne aus FA-BAK-010.
      SICHERUNG_PLAN: ${SICHERUNG_PLAN:-an}
    ports:
      - "8090:8090"
    depends_on:
      datenbank: { condition: service_healthy }
    # Kein healthcheck-Eintrag: Der im IMAGE ist der bessere. Er fragt /health
    # und prueft damit auch die Datenbank, waehrend ein Portest nur sagt, dass
    # jemand zuhoert. Ein Eintrag hier wuerde ihn ueberschreiben.
    volumes:
      - sicherungen:/sicherungen

  agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { BAUSTEIN: agent }
    container_name: pinroboter-agent
    environment:
      KONNEKTOR_URL: "https://simulator:8443/"
      TERMINAL_URL:  "https://simulator:8444/"
      # Am echten Kartenterminal liegt die Remote SMCB API auf demselben Port
      # wie die Verwaltungsschnittstelle; dann entfaellt dieser Eintrag. Der
      # Simulator braucht einen eigenen, weil der HTTP-Server des JDK nicht auf
      # WebSocket umschalten kann (ADR-0011).
      TERMINAL_SMCB_URL: "https://simulator:8445/"
      ZENTRALE_URL:  "http://zentrale:8090/"
      CA_URL:        "http://simulator:8480/ca.pem"
      PRUEFINTERVALL_SEKUNDEN: "10"
      # FA-AGT-010: Beim ersten Start loest der Agent dieses einmalig gueltige
      # Geheimnis gegen ein dauerhaftes Token ein. Es wird in der Zentrale unter
      # "Agenten" erzeugt. Nach der Registrierung kann der Eintrag entfallen.
      REGISTRIERUNG: ${REGISTRIERUNG:-}
      TOKEN_DATEI: "/daten/agent-token"
      MANDANT_ID: "Mandant1"
      CLIENTSYSTEM_ID: "PIN-Roboter"
      ARBEITSPLATZ_ID: "Arbeitsplatz1"
      SCHLUESSEL_DATEI: "/daten/agent-schluessel"
      PIN_ABLAGE: "/daten/pins"
      # ADR-0009: Schluessel fuer die verschluesselte PIN-Ablage des Agenten.
      # Getrennt vom GEHEIMNIS_SCHLUESSEL der Zentrale — wer den einen hat,
      # bekommt damit nicht auch den anderen. Erzeugen mit:
      #   openssl rand -base64 32
      # Fehlt er, bleiben hinterlegte PINs nur im Arbeitsspeicher und sind nach
      # einem Neustart weg. Nie im Repository (NFA-BET-010).
      PIN_ABLAGE_SCHLUESSEL: ${PIN_ABLAGE_SCHLUESSEL:-}
      # ---------------------------------------------------------------------
      # PINs der neun Demo-SMC-B.
      #
      # NUR FÜR DEN DEMOAUFBAU. Der Agent warnt beim Start ausdrücklich davor:
      # Eine PIN in einer Umgebungsvariablen steht im Klartext auf dem Host,
      # in jeder Sicherung und in "docker inspect". Im Betrieb wird sie über
      # die Oberfläche hinterlegt und Ende-zu-Ende verschlüsselt übertragen
      # (ADR-0009); eine so hinterlegte PIN hat Vorrang vor diesen Einträgen.
      #
      # Diese Karten gibt es nur im Simulator, ihre PIN ist kein Geheimnis.
      # Beim Einsatz mit echter Hardware sind alle neun Zeilen zu entfernen.
      PIN_card_smcb_NHAU: "123456"
      PIN_card_smcb_NKAR: "123456"
      PIN_card_smcb_NORT: "123456"
      PIN_card_smcb_MHAU: "123456"
      PIN_card_smcb_MINN: "123456"
      PIN_card_smcb_MRAD: "123456"
      PIN_card_smcb_SHAU: "123456"
      PIN_card_smcb_SGYN: "123456"
      PIN_card_smcb_SCHI: "123456"
      # ---------------------------------------------------------------------
      # Der Agent muss ≤ 512 MB bleiben (NFA-LEI-030) — er soll später auch auf
      # schwacher oder fremder Hardware mitlaufen können.
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:+UseSerialGC -Xss512k"
    volumes:
      # NFA-BET-020: Token, Schluesselpaar und PIN-Ablage gehoeren in ein Volume.
      # Im Container-Layer waeren sie nach jedem Neustart weg — der Agent
      # muesste sich neu registrieren und jede hinterlegte PIN waere unbrauchbar,
      # weil sie fuer ein Schluesselpaar verschluesselt ist, das es nicht mehr gibt.
      - agentdaten:/daten
    depends_on:
      simulator: { condition: service_healthy }
      zentrale:  { condition: service_healthy }

volumes:
  agentdaten:
  # Sicherungen liegen NICHT bei den Betriebsdaten (ADR-0010): Der häufigste
  # Verlustfall ist ein versehentliches "docker compose down -v".
  sicherungen:
  # Betriebsdaten und Protokolldaten getrennt (ADR-0005): unterschiedliches
  # Wachstum, unterschiedliche Aufbewahrung, unterschiedliches Ausfallrisiko.
  betriebsdaten:

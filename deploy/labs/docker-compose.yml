# PIN-Roboter auf Labs — gehärtete Auslieferung hinter Caddy.
#
# Unterschiede zum Entwicklungs-Compose im Wurzelverzeichnis:
#   • kein `build:` — es werden ausschließlich fertige Images aus GHCR gezogen
#   • kein `ports:` — erreichbar nur über den Reverse Proxy im Netz `edge`
#   • kein Simulator, kein Demo-Agent — beides gehört nicht in eine erreichbare
#     Umgebung; der Standort-Agent läuft beim Kunden, nicht hier
#   • read_only, cap_drop, no-new-privileges, pids_limit
#
# Ablage auf dem Host: /opt/docker/pin-roboter/
services:

  datenbank:
    image: postgres:16-alpine
    container_name: pin-roboter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinroboter
      POSTGRES_USER: pinroboter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      # Die Hosts laufen auf UTC; die Anwendung speichert zeitzonenbehaftet.
      TZ: UTC
    volumes:
      - pinroboter-db:/var/lib/postgresql/data
    networks: [intern]
    # Postgres schreibt zur Laufzeit in /var/run/postgresql und /tmp.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Postgres wechselt beim Start von root auf postgres — dafür bleibt SETUID/
    # SETGID nötig. Ohne sie startet das offizielle Image nicht.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinroboter -d pinroboter"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  pin-roboter:
    image: ghcr.io/mathi66/pin-roboter:${VERSION:?VERSION fehlt in der .env}
    container_name: pin-roboter
    restart: unless-stopped
    environment:
      PORT: "8090"
      DB_URL: "jdbc:postgresql://datenbank:5432/pinroboter"
      DB_USER: "pinroboter"
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      # Verschlüsselt die hinterlegten Geräte-Zugangsdaten (ADR-0008).
      # Ohne ihn bleibt die Anwendung nutzbar, nur Kennwörter lassen sich nicht
      # speichern. GEHT ER VERLOREN, sind gespeicherte Zugangsdaten unbrauchbar
      # — er gehört in die Sicherung, aber NICHT in dieselbe Datei wie der
      # Datenbankauszug.
      GEHEIMNIS_SCHLUESSEL: ${GEHEIMNIS_SCHLUESSEL:?GEHEIMNIS_SCHLUESSEL fehlt in der .env}
      # Speicherbudget des Fachprotokolls (FA-PRO-070). Ab 80 % rotiert es.
      PROTOKOLL_BUDGET: ${PROTOKOLL_BUDGET:-2G}
      SICHERUNG_ABLAGE: /sicherungen
      SICHERUNG_PLAN: ${SICHERUNG_PLAN:-an}
      # Erster Administrator (FA-BEN-035). Nach der Einrichtung entfernen.
      START_ADMIN_BENUTZER: ${START_ADMIN_BENUTZER:-}
      START_ADMIN_NAME: ${START_ADMIN_NAME:-}
      START_ADMIN_PASSWORT_DATEI: ${START_ADMIN_PASSWORT_DATEI:-}
      START_ADMIN_TOTP: ${START_ADMIN_TOTP:-}
      TZ: UTC
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -Djava.security.properties=/app/brainpool.security -Djava.io.tmpdir=/tmp"
    # Nur expose: Es wird kein Port auf dem Host geöffnet.
    expose:
      - "8090"
    depends_on:
      datenbank: { condition: service_healthy }
    volumes:
      # Sicherungen liegen NICHT bei den Betriebsdaten (ADR-0010): Der häufigste
      # Verlustfall ist ein versehentliches „docker compose down -v".
      - pinroboter-sicherungen:/sicherungen
    networks: [edge, intern]
    read_only: true
    # Die JVM schreibt nach /tmp (java.io.tmpdir, oben ausdrücklich gesetzt).
    # 64 MB genügen; ein unbegrenztes tmpfs ginge zu Lasten des Hosts.
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 512
    # Der HEALTHCHECK steckt im Image (docker/gesundheit.sh) und prüft
    # /health einschließlich Datenbank — hier nichts nachzutragen.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  edge:
    external: true
  intern:
    internal: true

volumes:
  # MUSS gesichert werden: Bestand, Konten, Fachprotokoll.
  pinroboter-db:
  # MUSS gesichert werden, wenn die anwendungseigene Sicherung genutzt wird.
  pinroboter-sicherungen:
